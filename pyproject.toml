[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-ai"
version = "0.1.0"
description = "Multi-agent incident investigation platform: LangGraph orchestration, MCP tool servers, A2A agents, hybrid RAG, guardrails and an evaluation benchmark."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=2.0,<4",
  "aiosqlite>=0.20",
  "mcp>=1.20,<2",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "rank-bm25>=0.2.2",
  "anthropic>=0.40",
  "pytest>=8.0",
]

[project.optional-dependencies]
dev = ["pytest-asyncio>=0.23"]

[project.scripts]
aegis = "aegis.cli:main"

[tool.setuptools.packages.find]
include = ["aegis*"]

[tool.setuptools.package-data]
"aegis" = ["api/static/*", "world/repo_files/platform_sim/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
